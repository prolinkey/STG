# RT-DETR-R1: lightweight focused-perception RT-DETR with P3-P5 outputs.

nc: 4
scales:
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

# Training-only Gaussian-guided activation supervision.
ggas:
  enabled: true
  small_area: 1024.0       # FPF small-object rule: area < 32^2 at the training input size
  sigma_ratio: 0.5         # Best ratio reported by the FPF ablation
  loss_weight: 0.25        # Conservative auxiliary-loss weight for RT-DETR
  truncate_sigma: 3.0      # Keep a finite foreground support for inverse-density weighting

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']]  # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']]  # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']]  # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]                        # 3-P2/4

  # PConv replaces only the second 3x3 branch inside each residual block.
  # [ch_out, block_type, block_nums, stage_num, act, variant]
  - [-1, 1, Blocks, [64, BasicBlock_PConv, 2, 2, 'relu']]    # 4-P2/4
  - [-1, 1, Blocks, [128, BasicBlock_PConv, 2, 3, 'relu']]   # 5-P3/8
  - [-1, 1, Blocks, [256, BasicBlock_PConv, 2, 4, 'relu']]   # 6-P4/16
  - [-1, 1, Blocks, [512, BasicBlock_PConv, 2, 5, 'relu']]   # 7-P5/32

head:
  # FPF-inspired semantic guidance: P4 guides P3 without adding a costly P2 detection head.
  - [[5, 6], 1, LiteCSAG, [64, 4, 3]]                       # 8 enhanced P3
  - [8, 1, GGASHead, [32]]                                  # 9 training-only activation logits

  - [7, 1, Conv, [256, 1, 1, None, 1, 1, False]]            # 10 input_proj.2
  - [-1, 1, AIFI, [1024, 8]]                                # 11
  - [-1, 1, Conv, [256, 1, 1]]                              # 12 Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]              # 13
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]            # 14 input_proj.1
  - [[-2, -1], 1, Concat, [1]]                              # 15
  - [-1, 3, RepC3, [256, 0.5]]                              # 16 FPN P4
  - [-1, 1, Conv, [256, 1, 1]]                              # 17 Y4

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]              # 18
  - [8, 1, Conv, [256, 1, 1, None, 1, 1, False]]            # 19 enhanced P3 projection
  - [[-2, -1], 1, Concat, [1]]                              # 20
  - [-1, 3, RepC3, [256, 0.5]]                              # 21 FPN P3

  - [-1, 1, Conv, [256, 3, 2]]                              # 22
  - [[-1, 17], 1, Concat, [1]]                              # 23
  - [-1, 3, RepC3, [256, 0.5]]                              # 24 PAN P4

  - [-1, 1, Conv, [256, 3, 2]]                              # 25
  - [[-1, 12], 1, Concat, [1]]                              # 26
  - [-1, 3, RepC3, [256, 0.5]]                              # 27 PAN P5

  - [[21, 24, 27], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 28 Detect(P3, P4, P5)
